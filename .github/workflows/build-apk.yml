name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon assembleRelease
      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk StickTV-tablet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StickTV-tablet
          path: StickTV-tablet.apk
          if-no-files-found: error
          retention-days: 30

